# Full stack: Postgres + API + web (nginx proxies /api → API).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Web UI: http://localhost:8080
# API (direct): http://localhost:3000/api/v1/health

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sofinda-api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://sofinda:sofinda@postgres:5432/sofinda
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-in-production}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sofinda-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
